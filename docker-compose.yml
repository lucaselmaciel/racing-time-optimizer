services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: racing
      POSTGRES_PASSWORD: racing
      POSTGRES_DB: racing_line
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racing -d racing_line"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
